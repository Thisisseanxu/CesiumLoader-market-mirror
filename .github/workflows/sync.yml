name: Sync CesiumLoader market mirror

on:
  schedule:
    # UTC 19:30 = Asia/Shanghai 03:30 on the following calendar day.
    - cron: '30 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'public/**'
      - 'generated/**'

permissions:
  contents: write

concurrency:
  group: cesiumloader-market-mirror-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORGE_UPSTREAM: ${{ vars.FORGE_UPSTREAM || 'https://forge.hiynet.com' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore verified package cache
        uses: actions/cache@v4
        with:
          path: .cache/forge-mirror
          key: ${{ runner.os }}-forge-packages-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-forge-packages-v1-

      - name: Install dependencies
        run: npm ci

      - name: Synchronize every published mod version
        run: npm run sync

      - name: Run compatibility and synchronization tests
        run: npm test

      - name: Validate deployable snapshot and files
        run: npm run build

      - name: Commit synchronized mirror files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public generated
          if git diff --cached --quiet; then
            echo 'Mirror snapshot is unchanged; no commit needed.'
            exit 0
          fi
          git commit -m 'chore: sync CesiumLoader market snapshot'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Save deployable mirror snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cesiumloader-market-mirror-${{ github.run_id }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            public/
            generated/
            edge-functions/
            src/
            scripts/
            edgeone.json
            package.json
            package-lock.json
            README.md
